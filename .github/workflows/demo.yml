name: demo-ci

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write artifact file
        run: |
          echo "This is the demo-build artifact for the CI smoke test." > artifact.txt
          cat artifact.txt
      - name: Upload demo-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-build
          path: artifact.txt
